<!DOCTYPE html>
<html lang="nb-NO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&display=swap" rel="stylesheet">
  <title>G&K | 16.08.25</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Gilda Display', serif;
      background-color: #f9f9f9;
      color: #333;
    }

    header {
      background-color: #000;
      padding: 16px 24px;
      display: flex;
      align-items: center;
    }

    .logo {
      background-color: #fff;
      color: #CFB53B;
      font-size: 1.4em;
      font-weight: bold;
      font-family: 'Gilda Display', serif;
      letter-spacing: 3px;
      padding: 8px 12px;
      border-radius: 6px;
    }

    .content {
      text-align: center;
      padding: 60px 20px;
    }

    a.gallery-link {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 32px;
  border: 1px solid #333;
  color: #333;
  text-decoration: none;
  font-size: 0.95em;
  letter-spacing: 2px;
  text-transform: uppercase;
  transition: all 0.3s ease;
}

a.gallery-link:hover {
  background-color: #333;
  color: #fff;
}
  </style>
</head>
<body>

  <header>
    <div class="logo">G|K</div>
  </header>

  <div class="content">
    <h1>Takk for sist!</h1>
    <p>Bildene som ble tatt bryllupshelga er fortsatt tilgjengelige på lenken nedenfor.</p>
    <a class="gallery-link" href="https://drive.google.com/drive/folders/19nzfFGrvQdNo8-Nms2ocJO4Hrd9aNfPf?usp=sharing" target="_blank">
