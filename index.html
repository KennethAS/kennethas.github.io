<!DOCTYPE html>
<html lang="nb-NO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Site Name</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    header {
      background-color: #000;
      padding: 16px 24px;
      display: flex;
      align-items: center;
    }

    .logo {
      color: #CFB53B;
      font-size: 1.8em;
      font-weight: bold;
      letter-spacing: 2px;
      font-family: Georgia, serif;
    }

    .content {
      text-align: center;
      padding: 60px 20px;
    }

    a.gallery-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background-color: #4a90d9;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1.1em;
    }

    a.gallery-link:hover {
      background-color: #357abd;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">G|K</div>
  </header>

  <div class="content">
    <h1>Welcome to Our Website</h1>
    <p>Takk for sist! Bildene som ble tatt bryllupshelga er fortsatt tilgjengelige på lenken nedenfor.</p>
    <a class="gallery-link" href="https://drive.google.com/drive/folders/19nzfFGrvQdNo8-Nms2ocJO4Hrd9aNfPf?usp=sharing" target="_blank">
      Vis meg bildene
    </a>
  </div>

</body>
</html>
